<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIGOUR Settings</title>
    <style>
        body {
            background-color: lavender;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        h1 {
            text-align: center;
            color: #6a5acd;
        }
        .section {
            margin: 20px 0;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input[type="checkbox"] {
            margin-right: 10px;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #6a5acd;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #5a4cb1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VIGOUR Settings</h1>
    
    <div class="section">
        <h2>Notification Preferences</h2>
        <label>
            <input type="checkbox"> Receive workout reminders
        </label>
        <label>
            <input type="checkbox"> Receive promotional notifications
        </label>
    </div>

    <div class="section">
        <h2>Theme Customization</h2>
        <label for="theme">Select Theme:</label>
        <select id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="colorful">Colorful</option>
        </select>
    </div>

    <div class="section">
        <h2>Data Privacy</h2>
        <label>
            <input type="checkbox"> Share data with third-party services
        </label>
    </div>

    <div class="section">
        <h2>Language</h2>
        <label for="language">Select Language:</label>
        <select id="language">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
        </select>
    </div>

    <button type="submit">Save Settings</button>
</div>

</body>
</html>
